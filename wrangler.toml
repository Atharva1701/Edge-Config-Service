name = "edge-config-worker"
main = "src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# KV namespace bindings
[[kv_namespaces]]
binding = "CONFIG_KV"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"
preview_id = "REPLACE_WITH_YOUR_KV_PREVIEW_NAMESPACE_ID"

# Environment variables (non-secret)
[vars]
ENVIRONMENT = "development"

# Secrets (set via: wrangler secret put API_TOKEN)
# API_TOKEN = "<set via wrangler secret>"

# Production environment
[env.production]
name = "edge-config-worker-prod"

[[env.production.kv_namespaces]]
binding = "CONFIG_KV"
id = "REPLACE_WITH_YOUR_PROD_KV_NAMESPACE_ID"

[env.production.vars]
ENVIRONMENT = "production"
